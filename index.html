<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Epoch | Created by DCA</title>
  
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #080c14;
      --surface: #0f172a;
      --card-bg: #141e33;
      --border: #1e293b;
      --border-bright: #334155;
      --accent: #facc15;
      --accent-dim: rgba(250, 204, 21, 0.12);
      --highlight: #38bdf8;
      --success: #10b981;
      --danger: #f43f5e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Minimalist Header */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border-bright);
      object-fit: cover;
    }

    .brand-meta h1 {
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .brand-meta .credit {
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.04em;
      font-weight: 600;
      text-transform: uppercase;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .lives-counter {
      color: var(--danger);
      letter-spacing: 2px;
      font-size: 0.95rem;
    }

    .score-badge {
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(250, 204, 21, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* Active Drawn Card */
    .hero-tray {
      padding: 16px;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #080c14 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .tray-indicator {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .incoming-card {
      background: var(--card-bg);
      border: 1px solid var(--highlight);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.18);
      border-radius: 12px;
      padding: 14px 18px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      animation: floatIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tags-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .pill {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: #1e293b;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .incoming-card h2 {
      font-size: 1.02rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .incoming-card p {
      font-size: 0.8rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    /* Timeline Play Area */
    .timeline-stream {
      flex: 1;
      padding: 18px 14px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Insertion Slot Buttons */
    .slot-trigger {
      width: 100%;
      max-width: 340px;
      background: rgba(56, 189, 248, 0.04);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      color: var(--highlight);
      padding: 9px 14px;
      margin: 5px 0;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.12s ease, transform 0.12s ease;
    }

    .slot-trigger:active {
      background: var(--highlight);
      color: #080c14;
      transform: scale(0.98);
    }

    /* Positioned Timeline Entries */
    .placed-node {
      background: #0d1527;
      border: 1px solid var(--border-bright);
      border-radius: 10px;
      padding: 10px 14px;
      width: 100%;
      max-width: 460px;
      position: relative;
    }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .node-date {
      color: var(--accent);
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
    }

    .node-region {
      font-size: 0.65rem;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .node-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.3;
    }

    /* Game Over Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      backdrop-filter: blur(6px);
    }

    .overlay.active {
      display: flex;
    }

    .modal-box {
      background: #0f172a;
      border: 1px solid var(--border-bright);
      border-radius: 16px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }

    .modal-box h2 {
      color: var(--danger);
      font-size: 1.35rem;
      margin-bottom: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-replay {
      background: var(--accent);
      color: #080c14;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 800;
      margin-top: 18px;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-replay:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <img src="./favicon.png" alt="Epoch Icon" class="brand-avatar">
      <div class="brand-meta">
        <h1>Epoch</h1>
        <div class="credit">Created by DCA</div>
      </div>
    </div>
    <div class="stats-bar">
      <div class="lives-counter" id="lives-display">❤️❤️❤️</div>
      <div class="score-badge" id="score-display">0 PTS</div>
    </div>
  </header>

  <div class="hero-tray">
    <div class="tray-indicator">Slot this milestone into order</div>
    <div class="incoming-card" id="incoming-card">
      <div class="tags-row">
        <span class="pill" id="card-region">Region</span>
        <span class="pill" id="card-cat">Domain</span>
      </div>
      <h2 id="card-title">Title</h2>
      <p id="card-clue">Clue</p>
    </div>
  </div>

  <main class="timeline-stream" id="timeline-area"></main>

  <div class="overlay" id="game-over-overlay">
    <div class="modal-box">
      <h2>Timeline Broken</h2>
      <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 14px;">You accumulated 3 chronological misalignments.</p>
      
      <div style="font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 4px;">
        <span id="final-score" style="color: var(--accent);">0</span> PTS
      </div>
      <div style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px;">
        Timeline Length: <span id="final-streak" style="color: var(--highlight); font-weight: 700;">0</span> Cards
      </div>
      <div style="font-size: 0.75rem; color: var(--text-sub);">
        Best Record: <span id="high-score-val" style="color: #fff; font-weight: 700;">0</span> PTS
      </div>

      <button class="btn-replay" onclick="initGame()">Play Again</button>
    </div>
  </div>

  <script src="./questions.js"></script>

  <script>
    // --- SYNTHESIZED SOUNDS (Zero External Network Latency) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audio = null;

    function sound(type) {
      try {
        if (!audio) audio = new AudioCtx();
        if (audio.state === 'suspended') audio.resume();
        const now = audio.currentTime;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.connect(gain);
        gain.connect(audio.destination);

        if (type === 'pass') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'fail') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.linearRampToValueAtTime(95, now + 0.25);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {}
    }

    // --- GAME ENGINE ---
    let pool = [];
    let placedCards = [];
    let currentCard = null;
    let lives = 3;
    let score = 0;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function initGame() {
      document.getElementById('game-over-overlay').classList.remove('active');
      lives = 3;
      score = 0;
      updateHeader();

      pool = shuffle(QUESTIONS_DB);
      placedCards = [];

      // Initial anchor card
      const anchor = pool.pop();
      placedCards.push(anchor);

      pickCard();
      renderTimeline();
    }

    function updateHeader() {
      document.getElementById('lives-display').innerText = '❤️'.repeat(Math.max(0, lives));
      document.getElementById('score-display').innerText = score + ' PTS';
    }

    function pickCard() {
      if (pool.length === 0) {
        alert("Incredible! You completed all cards in the question bank!");
        return;
      }
      currentCard = pool.pop();
      document.getElementById('card-region').innerText = currentCard.region;
      document.getElementById('card-cat').innerText = currentCard.category;
      document.getElementById('card-title').innerText = currentCard.title;
      document.getElementById('card-clue').innerText = currentCard.clue;
    }

    function renderTimeline() {
      const stream = document.getElementById('timeline-area');
      stream.innerHTML = '';

      // First slot
      stream.appendChild(createSlotBtn(0, "Before " + placedCards[0].displayValue));

      for (let i = 0; i < placedCards.length; i++) {
        const node = document.createElement('div');
        node.className = 'placed-node';
        node.innerHTML = `
          <div class="node-header">
            <span class="node-date">${placedCards[i].displayValue}</span>
            <span class="node-region">${placedCards[i].region}</span>
          </div>
          <div class="node-title">${placedCards[i].title}</div>
        `;
        stream.appendChild(node);

        const slotIndex = i + 1;
        const text = (i === placedCards.length - 1)
          ? "After " + placedCards[i].displayValue
          : "Between " + placedCards[i].displayValue + " & " + placedCards[i+1].displayValue;

        stream.appendChild(createSlotBtn(slotIndex, text));
      }
    }

    function createSlotBtn(index, label) {
      const btn = document.createElement('button');
      btn.className = 'slot-trigger';
      btn.innerHTML = `<span>⏷</span> ${label}`;
      btn.onclick = () => onSelectSlot(index);
      return btn;
    }

    function onSelectSlot(choice) {
      const val = currentCard.value;
      let valid = false;

      if (choice === 0) {
        valid = val <= placedCards[0].value;
      } else if (choice === placedCards.length) {
        valid = val >= placedCards[placedCards.length - 1].value;
      } else {
        valid = val >= placedCards[choice - 1].value && val <= placedCards[choice].value;
      }

      if (valid) {
        sound('pass');
        score += 100 + (placedCards.length * 20);
        placedCards.splice(choice, 0, currentCard);
        updateHeader();
        pickCard();
        renderTimeline();
      } else {
        sound('fail');
        lives--;
        updateHeader();

        alert(`Timeline Error!\n\n"${currentCard.title}" took place in ${currentCard.displayValue}.`);

        let correctIdx = 0;
        while (correctIdx < placedCards.length && placedCards[correctIdx].value < val) {
          correctIdx++;
        }
        placedCards.splice(correctIdx, 0, currentCard);

        if (lives <= 0) {
          showGameOver();
          return;
        }

        pickCard();
        renderTimeline();
      }
    }

    function showGameOver() {
      const best = parseInt(localStorage.getItem('epoch_best') || '0', 10);
      if (score > best) {
        localStorage.setItem('epoch_best', score);
      }
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-streak').innerText = placedCards.length;
      document.getElementById('high-score-val').innerText = Math.max(score, best);
      document.getElementById('game-over-overlay').classList.add('active');
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    window.addEventListener('DOMContentLoaded', initGame);
  </script>
</body>
</html>
