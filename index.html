<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Epoch | Created by DCA</title>
  
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #080c14;
      --card-bg: #141e33;
      --border: #1e293b;
      --border-bright: #334155;
      --accent: #facc15;
      --accent-dim: rgba(250, 204, 21, 0.12);
      --highlight: #38bdf8;
      --success: #10b981;
      --success-dim: rgba(16, 185, 129, 0.15);
      --danger: #f43f5e;
      --danger-dim: rgba(244, 63, 94, 0.15);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border-bright);
      object-fit: cover;
    }

    .brand-meta h1 {
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .brand-meta .credit {
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.04em;
      font-weight: 600;
      text-transform: uppercase;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .lives-counter {
      color: var(--danger);
      letter-spacing: 2px;
      font-size: 0.95rem;
    }

    .score-badge {
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(250, 204, 21, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 14px;
    }

    /* Question Card */
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--border-bright);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .meta-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .pill {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1e293b;
      color: var(--highlight);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .question-text {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.45;
      color: #fff;
    }

    /* Options Stack */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt-btn {
      background: #0f172a;
      border: 1px solid var(--border-bright);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: border-color 0.15s, background 0.15s;
    }

    .opt-btn:active:not(:disabled) {
      background: #1e293b;
      border-color: var(--highlight);
    }

    .opt-btn.correct {
      background: var(--success-dim) !important;
      border-color: var(--success) !important;
      color: #34d399 !important;
      font-weight: 700;
    }

    .opt-btn.incorrect {
      background: var(--danger-dim) !important;
      border-color: var(--danger) !important;
      color: #f87171 !important;
    }

    .opt-letter {
      font-weight: 800;
      font-size: 0.8rem;
      color: var(--accent);
      padding-top: 1px;
    }

    /* Trivia Explanation Box */
    .trivia-card {
      background: #0d1527;
      border: 1px solid var(--border-bright);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 14px;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    .trivia-card.active {
      display: block;
    }

    .trivia-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 6px;
    }

    .trivia-content {
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--text-sub);
      white-space: pre-line;
    }

    /* Advance Button */
    .btn-next {
      background: var(--highlight);
      color: #080c14;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: none;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
      margin-bottom: 20px;
    }

    .btn-next.active {
      display: block;
    }

    .btn-next:active {
      opacity: 0.9;
      transform: scale(0.99);
    }

    /* Game Over Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .overlay.active {
      display: flex;
    }

    .modal-box {
      background: #0f172a;
      border: 1px solid var(--border-bright);
      border-radius: 16px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }

    .modal-box h2 {
      color: var(--danger);
      font-size: 1.35rem;
      margin-bottom: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-replay {
      background: var(--accent);
      color: #080c14;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 800;
      margin-top: 18px;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <img src="./favicon.png" alt="Epoch Icon" class="brand-avatar">
      <div class="brand-meta">
        <h1>Epoch</h1>
        <div class="credit">Created by DCA</div>
      </div>
    </div>
    <div class="stats-bar">
      <div class="lives-counter" id="lives-display">❤️❤️❤️</div>
      <div class="score-badge" id="score-display">0 PTS</div>
    </div>
  </header>

  <main>
    <div class="question-card">
      <div class="meta-tags">
        <span class="pill" id="q-region">Region</span>
        <span class="pill" id="q-category">Category</span>
      </div>
      <div class="question-text" id="q-text">Loading question...</div>
    </div>

    <div class="options-grid" id="options-container"></div>

    <div class="trivia-card" id="trivia-box">
      <div class="trivia-title">Historical & Scientific Context</div>
      <div class="trivia-content" id="trivia-text"></div>
    </div>

    <button class="btn-next" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
  </main>

  <div class="overlay" id="game-over-overlay">
    <div class="modal-box">
      <h2>Session Complete</h2>
      <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 14px;">You ran out of lives.</p>
      
      <div style="font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 4px;">
        <span id="final-score" style="color: var(--accent);">0</span> PTS
      </div>
      <div style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px;">
        Answered Correctly: <span id="final-correct" style="color: var(--highlight); font-weight: 700;">0</span>
      </div>
      <div style="font-size: 0.75rem; color: var(--text-sub);">
        Best Record: <span id="high-score-val" style="color: #fff; font-weight: 700;">0</span> PTS
      </div>

      <button class="btn-replay" onclick="initGame()">Play Again</button>
    </div>
  </div>

  <script src="./questions.js"></script>

  <script>
    // --- SYNTHESIZED SOUNDS ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audio = null;

    function sound(type) {
      try {
        if (!audio) audio = new AudioCtx();
        if (audio.state === 'suspended') audio.resume();
        const now = audio.currentTime;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.connect(gain);
        gain.connect(audio.destination);

        if (type === 'pass') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12); // G5
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'fail') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.linearRampToValueAtTime(95, now + 0.25);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {}
    }

    // --- GAME ENGINE ---
    let pool = [];
    let currentQ = null;
    let lives = 3;
    let score = 0;
    let correctCount = 0;
    let answered = false;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function initGame() {
      document.getElementById('game-over-overlay').classList.remove('active');
      lives = 3;
      score = 0;
      correctCount = 0;
      updateHeader();

      pool = shuffle(QUESTIONS_DB);
      nextQuestion();
    }

    function updateHeader() {
      document.getElementById('lives-display').innerText = '❤️'.repeat(Math.max(0, lives));
      document.getElementById('score-display').innerText = score + ' PTS';
    }

    function nextQuestion() {
      answered = false;
      document.getElementById('trivia-box').classList.remove('active');
      document.getElementById('next-btn').classList.remove('active');

      if (pool.length === 0) {
        alert("Outstanding! You cleared all questions in the deck!");
        showGameOver();
        return;
      }

      currentQ = pool.pop();
      document.getElementById('q-region').innerText = currentQ.region;
      document.getElementById('q-category').innerText = currentQ.category;
      document.getElementById('q-text').innerText = currentQ.question;

      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';

      const letters = ['A', 'B', 'C', 'D'];
      currentQ.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${optText}</span>`;
        btn.onclick = () => selectOption(idx);
        optsContainer.appendChild(btn);
      });
    }

    function selectOption(chosenIdx) {
      if (answered) return;
      answered = true;

      const buttons = document.querySelectorAll('.opt-btn');
      buttons.forEach(b => b.disabled = true);

      const isCorrect = chosenIdx === currentQ.correct;

      if (isCorrect) {
        sound('pass');
        score += 150;
        correctCount++;
        buttons[chosenIdx].classList.add('correct');
      } else {
        sound('fail');
        lives--;
        buttons[chosenIdx].classList.add('incorrect');
        buttons[currentQ.correct].classList.add('correct');
      }

      updateHeader();

      // Show in-depth educational trivia
      document.getElementById('trivia-text').innerText = currentQ.trivia;
      document.getElementById('trivia-box').classList.add('active');

      if (lives <= 0) {
        setTimeout(showGameOver, 1200);
      } else {
        document.getElementById('next-btn').classList.add('active');
      }
    }

    function showGameOver() {
      const best = parseInt(localStorage.getItem('epoch_best') || '0', 10);
      if (score > best) {
        localStorage.setItem('epoch_best', score);
      }
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-correct').innerText = correctCount;
      document.getElementById('high-score-val').innerText = Math.max(score, best);
      document.getElementById('game-over-overlay').classList.add('active');
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    window.addEventListener('DOMContentLoaded', initGame);
  </script>
</body>
</html>
